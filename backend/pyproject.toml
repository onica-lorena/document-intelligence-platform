[project]
name = "document-intelligence-backend"
version = "0.1.0"
description = "Backend for an AI-powered document intelligence platform built with FastAPI and Large Language Models."
authors = [
    {name = "Lorena Onica",email = "onica.lorena05@gmail.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.0,<0.53.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "motor (>=3.7.1,<4.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pymupdf (>=1.28.0,<2.0.0)",
    "sentence-transformers (>=5.7.0,<6.0.0)",
    "qdrant-client (>=1.19.0,<2.0.0)",
    "pytesseract (>=0.3.13,<0.4.0)",
    "Pillow (>=11.0.0,<13.0.0)",
    "ollama (>=0.6.2,<0.7.0)",
]

[tool.poetry]
packages = [
    { include = "app" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
